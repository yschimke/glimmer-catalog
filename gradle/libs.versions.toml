[versions]
kotlin = "2.4.20"
ktfmt = "0.27.0"
agp = "9.4.1"
robolectric = "4.17"
glimmer = "1.0.0-alpha20"
androidx-compose-ui = "1.12.1"
androidx-compose-material-icons = "1.7.8"
compose-multiplatform = "1.12.0"
androidx-annotation = "1.10.0"
composePreviewPlugin = "2.39.2"
# The ONE version for every ee.schimke.composeai runtime module below: they are versionless and
# resolve through ee.schimke.composeai:compose-preview-daemon-bom, applied as `platform(...)` in each
# module that uses them. compose-preview-daemon publishes only the modules that changed in a release,
# so per-module versions diverge (the 3.13.0 BOM pins preview-annotations at 3.13.0 but
# data-preview-overrides-runtime and data-glimmer-environment-connector at 3.12.0) and a direct pin
# at the release version 404s the first time a release skips a module.
# This may lead the compose-preview plugin above (its renderer resolves in this runtime graph, so a
# newer BOM aligns both) but must not predate the daemon the plugin bakes in (plugin 2.35.1 bakes
# daemon 3.14.1). :verifyComposePreviewDaemonAlignment (root build.gradle.kts) fails the build on an
# older BOM. Renovate moves it with the compose-preview-daemon train.
composePreviewDaemon = "3.15.0"

[libraries]
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
compose-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
glimmer = { module = "androidx.xr.glimmer:glimmer", version.ref = "glimmer" }
glimmer-google-fonts = { module = "androidx.xr.glimmer:glimmer-google-fonts", version.ref = "glimmer" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "androidx-compose-ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "androidx-compose-ui" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "androidx-compose-material-icons" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
composeai-daemon-bom = { module = "ee.schimke.composeai:compose-preview-daemon-bom", version.ref = "composePreviewDaemon" }
# Versionless: resolved through composeai-daemon-bom. Never add a version here.
composeai-preview-overrides = { module = "ee.schimke.composeai:data-preview-overrides-runtime" }
composeai-preview-annotations = { module = "ee.schimke.composeai:preview-annotations" }
composeai-glimmer-environment = { module = "ee.schimke.composeai:data-glimmer-environment-connector" }
# Substituted by the compose-ui-builder checkout named with -PcomposeUiBuilderDir; never on Maven.
composeai-ui-builder-renderer-sdk-source = { module = "ee.schimke.composeai:ui-builder-renderer-sdk-source", version = "source" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composePreview = { id = "ee.schimke.composeai.preview", version.ref = "composePreviewPlugin" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
