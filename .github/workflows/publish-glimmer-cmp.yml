name: Publish Glimmer CMP port

# Publishes the vendored Compose Multiplatform port of Glimmer (vendor/README.md) to a credential-free
# Maven repository served from the `glimmer-cmp-maven` branch of yschimke/glimmer-catalog-out, the public
# output repository that already carries the design artifacts, so no generated branch lives in this
# source repository. vendor/glimmer-upstream.json owns the immutable version,
# `<release>-cmp<portRevision>`; a version that is already on the branch is never rebuilt or
# overwritten: changed bytes need a new `portRevision`.
on:
  push:
    branches: [main]
    paths:
      - 'vendor/glimmer-upstream.json'
      - 'vendor/glimmer/**'
      - 'scripts/verify-glimmer-vendor.mjs'
      - '.github/workflows/publish-glimmer-cmp.yml'
  workflow_dispatch:

concurrency:
  group: publish-glimmer-cmp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.repository == 'yschimke/glimmer-catalog' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAVEN_REPOSITORY: yschimke/glimmer-catalog-out
      MAVEN_BRANCH: glimmer-cmp-maven
      # ARTIFACTS_TOKEN is the credential the design-artifacts lanes already push to the output
      # repository with; github.token cannot write outside this repository.
      MAVEN_REMOTE: https://x-access-token:${{ secrets.ARTIFACTS_TOKEN }}@github.com/yschimke/glimmer-catalog-out.git
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup
        with:
          cache-read-only: 'true'

      - name: Verify vendored source provenance
        run: node scripts/verify-glimmer-vendor.mjs

      - name: Read version and published tree
        id: state
        shell: bash
        run: |
          set -euo pipefail
          version=$(./gradlew -q printGlimmerCmpPortVersion)
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Orphan-create the branch the first time; afterwards publish on top of what is there, so
          # every earlier version stays resolvable.
          tree="$RUNNER_TEMP/glimmer-cmp-maven"
          if git ls-remote --exit-code --heads "$MAVEN_REMOTE" "$MAVEN_BRANCH" >/dev/null 2>&1; then
            git clone -q --depth 1 --branch "$MAVEN_BRANCH" "$MAVEN_REMOTE" "$tree"
          else
            git init -q "$tree"
            git -C "$tree" checkout -q --orphan "$MAVEN_BRANCH"
          fi
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

          if [ -d "$tree/ee/schimke/glimmercmp/glimmer/$version" ]; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Already published
        if: steps.state.outputs.published == 'true'
        run: |
          {
            echo "### ${{ steps.state.outputs.version }} is already published"
            echo
            echo 'Published versions are immutable. Bump `portRevision` in'
            echo '`vendor/glimmer-upstream.json` to publish changed bytes.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Maven repository
        if: steps.state.outputs.published == 'false'
        run: ./gradlew --stacktrace publishGlimmerCmpToBuildDir

      - name: Push Maven repository
        if: steps.state.outputs.published == 'false'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.state.outputs.version }}"
          tree="${{ steps.state.outputs.tree }}"
          cp -r build/glimmer-cmp-maven/. "$tree/"
          git -C "$tree" add -A
          if git -C "$tree" diff --cached --quiet; then
            echo 'The published tree is already identical.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -C "$tree" \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "chore: publish Glimmer CMP port $version"
          git -C "$tree" push -q "$MAVEN_REMOTE" "HEAD:$MAVEN_BRANCH"
          {
            echo "### Published $version"
            echo
            echo '```kotlin'
            echo "maven(\"https://raw.githubusercontent.com/$MAVEN_REPOSITORY/$MAVEN_BRANCH/\") {"
            echo '  content { includeGroup("ee.schimke.glimmercmp") }'
            echo '}'
            echo "implementation(\"ee.schimke.glimmercmp:glimmer:$version\")"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
