name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android-catalogs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install Android 37.0
        run: >-
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0'
      - name: Compile, discover, and test
        run: |
          ./gradlew --stacktrace \
            :catalog:assemble :catalog:composePreviewDiscover :catalog:test \
            :samples-catalog:assemble :samples-catalog:composePreviewDiscover \
            ktfmtCheck
          node scripts/check-ui-builder.mjs
          scripts/design-map.sh --check

  generated-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: yschimke/compose-ai-tools
          ref: main
          path: compose-ai-tools
          persist-credentials: false
      # The validators moved out of compose-ai-tools' scripts/design-artifacts into the
      # @design-parity/export-driver package. Install it the way the design-artifacts workflows do:
      # `npm ci` from compose-ai-tools' reviewed lock, which exports DRIVER_DIR.
      - name: Fetch the export driver (@design-parity/export-driver)
        run: compose-ai-tools/.github/scripts/install-export-driver.sh "$RUNNER_TEMP/export-driver"
      - name: Validate catalog specs
        run: |
          node "$DRIVER_DIR/validate-catalog-spec.mjs" \
            --spec catalog.spec.json --module-dir catalog
          node "$DRIVER_DIR/validate-catalog-spec.mjs" \
            --spec samples-catalog/catalog.spec.json --module-dir samples-catalog
      - name: Validate UI Builder policy
        run: |
          node "$DRIVER_DIR/validate-ui-builder-policy.mjs" \
            --policy ui-builder.policy.json --strict
      - name: Check generated sources and scripts
        run: |
          node scripts/samples-spec.mjs --check
          node --test scripts/*.test.mjs

  cmp-port:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Compile JVM and Wasm, render desktop proof, and build Maven tree
        run: |
          node scripts/verify-glimmer-vendor.mjs
          ./gradlew --stacktrace \
            :vendor:glimmer:compileKotlinJvm \
            :vendor:glimmer:compileKotlinWasmJs \
            :glimmer-desktop:test \
            publishGlimmerCmpToBuildDir
